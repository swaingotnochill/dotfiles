# ==============================================================================
# TMUX CONFIGURATION - Vim-like Keybindings
# ==============================================================================

# ─── PREFIX KEY ───────────────────────────────────────────────────────────────
# Change prefix from Ctrl+b to Ctrl+Space (more ergonomic)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── GENERAL SETTINGS ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster command sequences (no delay for escape)
set -sg escape-time 0

# Increase repeat timeout
set -g repeat-time 600

# Focus events for vim autoread
set -g focus-events on

# ─── VIM-LIKE KEYBINDINGS ─────────────────────────────────────────────────────

# Pane Navigation (vim-style: h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alternative: Use Ctrl+h/j/k/l without prefix (seamless with neovim)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane Splitting (more intuitive)
bind | split-window -h -c "#{pane_current_path}"  # Vertical split (|)
bind - split-window -v -c "#{pane_current_path}"  # Horizontal split (-)
bind \\ split-window -h -c "#{pane_current_path}" # Alternative vertical
bind _ split-window -v -c "#{pane_current_path}"  # Alternative horizontal

# Unbind default splits
unbind '"'
unbind %

# Pane Resizing (vim-style with Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine-grained resize with Alt
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# ─── WINDOW MANAGEMENT ────────────────────────────────────────────────────────
# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Previous/Next window
bind -r p previous-window
bind -r n next-window

# Last window (like vim's Ctrl+6)
bind Tab last-window

# ─── SESSION MANAGEMENT ───────────────────────────────────────────────────────
bind s choose-tree -Zs              # List sessions
bind S new-session                  # New session
bind X confirm-before kill-session  # Kill session

# ─── COPY MODE (VIM-LIKE) ─────────────────────────────────────────────────────
setw -g mode-keys vi

# Enter copy mode with prefix+v (like visual mode)
bind v copy-mode

# Copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Mouse selection copies to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste with prefix+p
bind p paste-buffer

# ─── QUICK ACTIONS ────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Close pane without confirmation
bind x kill-pane

# Close window with confirmation
bind X confirm-before kill-window

# Toggle synchronize panes (type in all panes)
bind a setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# Clear screen and history
bind C-l send-keys 'C-l' \; run 'sleep 0.1' \; clear-history

# ─── STATUS BAR ───────────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5

# Status bar colors
set -g status-style bg=default,fg=white

# Left side: session name
set -g status-left-length 30
set -g status-left "#[fg=blue,bold]  #S #[fg=white]│ "

# Right side: date and time
set -g status-right-length 50
set -g status-right "#[fg=white]│ #[fg=yellow]%a %d %b #[fg=white]│ #[fg=green]%H:%M "

# Window status
set -g window-status-format "#[fg=gray] #I:#W "
set -g window-status-current-format "#[fg=cyan,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=cyan

# Message style
set -g message-style bg=default,fg=yellow,bold

# ─── PLUGINS (via TPM) ────────────────────────────────────────────────────────
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless vim/tmux navigation

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings (auto-save every 15 min)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'

# ─── KEYBINDING CHEATSHEET ────────────────────────────────────────────────────
# Prefix = Ctrl+Space
#
# PANES:
#   |  or  \    = Vertical split
#   -  or  _    = Horizontal split
#   h/j/k/l     = Navigate panes (also Ctrl+h/j/k/l without prefix)
#   H/J/K/L     = Resize panes
#   x           = Close pane
#
# WINDOWS:
#   c           = New window
#   n/p         = Next/Previous window
#   Tab         = Last window
#   Alt+1-5     = Go to window 1-5
#   X           = Close window (confirm)
#
# SESSIONS:
#   s           = List sessions
#   S           = New session
#   d           = Detach
#
# COPY MODE:
#   v           = Enter copy mode
#   v (in copy) = Start selection
#   y           = Copy selection
#   p           = Paste
#
# OTHER:
#   r           = Reload config
#   a           = Toggle sync panes
